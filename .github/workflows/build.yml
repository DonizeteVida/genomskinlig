
name: Build genomskinlig

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: genomskinlig-linux-x86_64
          path: target/${{ matrix.target }}/release/genomskinlig

      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: genomskinlig-windows-x86_64
          path: target/${{ matrix.target }}/release/genomskinlig.exe

      - name: Upload macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: genomskinlig-macos-arm64
          path: target/${{ matrix.target }}/release/genomskinlig
